<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#132b50" />
  <meta name="description" content="Professional Salesperson Profile Assessment System — ระบบประเมินนักขายมืออาชีพ" />
  <title>Professional Salesperson Profile Assessment System</title>
  <link rel="preconnect" href="https://script.google.com" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand" aria-label="Professional Salesperson Profile Assessment System">
        <div class="brand-mark" aria-hidden="true">SP</div>
        <div class="brand-copy">
          <strong>Professional Salesperson Profile Assessment System</strong>
          <span>ระบบประเมินนักขายมืออาชีพ</span>
        </div>
      </div>

      <div class="topbar-actions">
        <button class="icon-button" id="reloadButton" type="button" title="โหลดระบบใหม่" aria-label="โหลดระบบใหม่">
          <span aria-hidden="true">↻</span>
        </button>
        <a
          class="open-button"
          id="openSystemButton"
          href="https://script.google.com/macros/s/AKfycbw1vKFcrAEHBX7CVpYdDxtAkvc1SYB0WHivhOpC7RyIKk56TyhPRbw7nzLlLbGAdMVGQg/exec"
          target="_blank"
          rel="noopener noreferrer"
        >
          เปิดระบบเต็มหน้าจอ
        </a>
      </div>
    </header>

    <main class="workspace">
      <section class="system-frame" aria-label="ระบบประเมินนักขายมืออาชีพ">
        <div class="loading" id="loadingState" role="status" aria-live="polite">
          <div class="spinner" aria-hidden="true"></div>
          <div>
            <strong>กำลังเปิดระบบประเมิน</strong>
            <p>กรุณารอสักครู่ ระบบกำลังเชื่อมต่อกับฐานข้อมูล</p>
          </div>
        </div>

        <iframe
          id="assessmentFrame"
          title="Professional Salesperson Profile Assessment System"
          src="https://script.google.com/macros/s/AKfycbw1vKFcrAEHBX7CVpYdDxtAkvc1SYB0WHivhOpC7RyIKk56TyhPRbw7nzLlLbGAdMVGQg/exec"
          loading="eager"
          referrerpolicy="strict-origin-when-cross-origin"
          allow="clipboard-read; clipboard-write"
        ></iframe>
      </section>
    </main>

    <footer class="footer">
      <span>แบบประเมินนี้ใช้เพื่อการเรียนรู้และพัฒนาตนเอง ไม่ใช่การวินิจฉัยทางจิตวิทยาหรือทางคลินิก</span>
      <span class="connection"><i aria-hidden="true"></i> Google Apps Script</span>
    </footer>
  </div>

  <noscript>
    <div class="noscript">
      กรุณาเปิดใช้งาน JavaScript หรือ
      <a href="https://script.google.com/macros/s/AKfycbw1vKFcrAEHBX7CVpYdDxtAkvc1SYB0WHivhOpC7RyIKk56TyhPRbw7nzLlLbGAdMVGQg/exec">เปิดระบบประเมินโดยตรง</a>
    </div>
  </noscript>

  <script src="app.js"></script>
</body>
</html>
